# Cluster label overrides voor de 8-jaar/"full"-clustering
# (data/plenair-map/clusters-full.json, dataset_version 6).
#
# Losstaand van config/a0map/cluster_label_overrides.toml, dat bij de
# eerdere 1-jaar/A0-poster-clustering hoort -- zelfde (level, cluster_id)-
# sleutelformaat, maar verwijst naar een andere dataset, dus niet uitwisselbaar.
#
# Herkomst: scripts/rematch_cluster_label_anchors.py heeft de 199 oude
# handmatige labels (uit de A0-clustering) teruggekoppeld aan deze nieuwe
# clustering op basis van document-overlap/vector-gelijkenis. Deze 152
# regels zijn de eenduidige matches (geen samenloop met een ander oud
# label op hetzelfde nieuwe cluster) en zijn zonder individuele beoordeling
# overgenomen. Zie issue #291 (bronbestanden, rematch-resultaat) en #338
# (resterende conflicten, nog te beoordelen).

