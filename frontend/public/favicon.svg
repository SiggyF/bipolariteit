<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" fill="none">
	<style>
		.bipolar-stroke { stroke: #221f1b; }
		.bipolar-fill { fill: #221f1b; }
		@media (prefers-color-scheme: dark) {
			.bipolar-stroke { stroke: #f2ede3; }
			.bipolar-fill { fill: #f2ede3; }
		}
	</style>
	<ellipse cx="35" cy="30" rx="30" ry="13" transform="rotate(-15 35 30)" class="bipolar-stroke" stroke-width="2.5" />
	<ellipse cx="65" cy="30" rx="30" ry="13" transform="rotate(15 65 30)" class="bipolar-stroke" stroke-width="2.5" />
	<circle cx="7" cy="39" r="5" class="bipolar-fill" />
	<circle cx="93" cy="39" r="5" class="bipolar-fill" />
</svg>
