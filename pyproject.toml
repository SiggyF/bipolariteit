[project]
name = "bipolariteit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "prince>=0.20.1",
    "requests>=2.34.2",
    "scrapy>=2.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# crawlers/tweede_kamer is een eigen scrapy-project (scrapy.cfg) en geen
# subpakket van de repo-root; erbij zetten maakt `from tweede_kamer import ...`
# in tests mogelijk zonder sys.path-gefrommel.
pythonpath = [".", "crawlers/tweede_kamer"]
