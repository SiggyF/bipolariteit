[project]
name = "bipolariteit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.31.0",
    "numpy>=2.5.1",
    "prince>=0.20.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scrapy>=2.17.0",
    "tifffile>=2026.8.23",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `Makefile`/de pipeline-scripts roepen overal kaal `uv run python ...` aan,
# zonder `--group` (bv. `pipeline.tiling.build_pyramid` verwacht `tiling`,
# `experiment_umap_documents.py` verwacht `experiments`) -- zonder dit zou
# een kale `uv sync` de niet-`dev`-groepen weer verwijderen (uv's default is
# alleen `dev`), en zo'n rebuild-cyclus kost een hdbscan-compile (`Python.h`
# nodig, dus ook `python3.14-dev` als systeempakket).
[tool.uv]
default-groups = "all"

# `pipeline` en `scripts` als top-level packages (geen src/-layout, ze staan
# al op de repo-root) -- `uv sync` installeert het project hiermee editable,
# waardoor `from pipeline... / from scripts...` overal werkt zonder
# `PYTHONPATH=.`-gefrommel (zie docs/handoff.md voor de oude workaround).
# `crawlers/tweede_kamer` blijft buiten dit package: dat is zijn eigen
# scrapy-project (eigen scrapy.cfg), al apart geregeld via
# `[tool.pytest.ini_options] pythonpath` hieronder.
[tool.hatch.build.targets.wheel]
packages = ["pipeline", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
experiments = [
    "hdbscan>=0.8.44",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "pandas>=3.0.5",
    "tqdm>=4.70.0",
    "umap-learn>=0.5.12",
]
tiling = [
    # <3.10: bokeh 3.10 breekt distributed 2026.8.0's dashboard (Document.title
    # is nu een kale string i.p.v. een Title-object) -- AttributeError, 500 op
    # /status. distributed volgt bokeh-compat meestal met vertraging.
    "bokeh>=3.1.0,<3.10",
    "dask[distributed]>=2026.8.0",
    "mapbox-vector-tile>=2.2.0",
    "morecantile>=7.0.3",
    "pmtiles>=3.7.0",
    "datashader>=0.19.1",
    "colorspacious>=1.1.2",
]

[tool.pytest.ini_options]
# crawlers/tweede_kamer is een eigen scrapy-project (scrapy.cfg) en geen
# subpakket van de repo-root; erbij zetten maakt `from tweede_kamer import ...`
# in tests mogelijk zonder sys.path-gefrommel.
pythonpath = [".", "crawlers/tweede_kamer"]
