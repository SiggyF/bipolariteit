<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>eigen player PoC</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  .stage { position: relative; width: 640px; }
  video { display: block; width: 640px; height: 360px; }
  svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .marker-label { font: 13px/1.3 sans-serif; fill: #fff; }
  .marker-bg { fill: rgba(0,0,0,.55); }
</style>
</head>
<body>
<div class="stage">
  <video id="v" width="640" height="360" controls></video>
  <svg class="overlay" id="overlaySvg" viewBox="0 0 640 360" preserveAspectRatio="none">
    <!-- label bubble, top-left, transparant -->
    <g id="labelGroup">
      <rect id="labelBg" class="marker-bg" x="8" y="8" width="10" height="24" rx="4"></rect>
      <text id="labelText" class="marker-label" x="16" y="25">wachten...</text>
    </g>
    <!-- fallacy/argument-type badge, top-right, only visible while
         video.currentTime is inside the matched quote's cue range -->
    <g id="tagBadge" opacity="0" style="transition: opacity 0.2s;">
      <rect x="500" y="8" width="132" height="34" rx="6" fill="rgba(200,20,20,.85)"></rect>
      <text x="516" y="30" font-size="20">&#9888;&#65039;</text>
      <text x="546" y="30" class="marker-label" font-weight="bold">drogreden</text>
    </g>
  </svg>
</div>
<div id="log" style="font:12px monospace;white-space:pre;"></div>
<script>
  const MANIFEST = "https://livestreaming.b67v2.tweedekamer.nl/2026-07-01/plenairezaal/index.m3u8?hd=1&subtitles=vod&keyframes=1&start=2026-07-01T13%3A35%3A26%2B0200&end=2026-07-02T01%3A14%3A54%2B0200";
  const video = document.getElementById('v');
  const logEl = document.getElementById('log');
  const log = (...args) => { console.log(...args); logEl.textContent += args.join(' ') + "\n"; };

  window.__status = { events: [] };

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(MANIFEST);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (evt, data) => {
      const info = { type: data.type, details: data.details, fatal: data.fatal, mimeType: data.mimeType, err: data.error && data.error.message };
      log('HLS ERROR', JSON.stringify(info));
      window.__status.events.push({ kind: 'error', data: info });
    });
    hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
      log('MANIFEST_PARSED, levels:', data.levels.length);
      window.__status.events.push({ kind: 'manifest_parsed', levels: data.levels.length });
      // don't seek/play yet -- wait until we know the matched quote's
      // startTime, so we land just before it instead of a stale hardcoded
      // offset from an earlier, unrelated test.
    });
    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (evt, data) => {
      log('SUBTITLE_TRACKS_UPDATED, tracks:', JSON.stringify((data.subtitleTracks || []).map(t => ({ name: t.name, lang: t.lang }))));
      if (hls.subtitleTracks.length > 0) {
        hls.subtitleTrack = 0; // enable the (only) Dutch track, so cues load...
      }
    });
    hls.on(Hls.Events.SUBTITLE_TRACK_LOADED, (evt, data) => {
      log('SUBTITLE_TRACK_LOADED, cues so far will populate video.textTracks');
      // ...but hide the native caption rendering: we only need the cue data
      // for matching, not to show Dutch captions to the viewer.
      setTimeout(() => {
        for (const track of video.textTracks) track.mode = 'hidden';
        matchQuoteAgainstCues();
      }, 1000);
    });
  } else {
    log('hls.js not supported in this browser');
  }

  // Real quote from arguments.quote_text for this exact debate (document_id
  // whose published_at=2026-07-01T13:41:13), matched by hand against the vod.vtt
  // subtitle dump to confirm the text is really in there. Here we let the
  // browser do the HLS-subtitle-clock-to-video-clock mapping instead of us
  // hand-computing X-TIMESTAMP-MAP offsets.
  const QUOTE_NEEDLE = 'de stikstofobsessie gaat de natuur niet eens helpen';

  function matchQuoteAgainstCues() {
    const tracks = video.textTracks;
    log('textTracks found:', tracks.length);
    for (let i = 0; i < tracks.length; i++) {
      const track = tracks[i];
      log('track', i, track.kind, track.label, track.language, 'mode=', track.mode, 'cues=', track.cues ? track.cues.length : 0);
      if (!track.cues) continue;

      // Build one continuous transcript with a char-offset -> cue index map,
      // so a quote spanning multiple short cues (as seen in the raw .vtt
      // dump) is found by plain substring search, not brittle windowing.
      const cues = Array.from(track.cues);
      let transcript = '';
      const offsetToCue = [];
      for (const cue of cues) {
        const normalized = cue.text.replace(/\s+/g, ' ').trim();
        offsetToCue.push({ offset: transcript.length, cue });
        transcript += normalized.toLowerCase() + ' ';
      }

      const idx = transcript.indexOf(QUOTE_NEEDLE);
      if (idx === -1) {
        log('geen match voor:', QUOTE_NEEDLE);
        continue;
      }
      const endIdx = idx + QUOTE_NEEDLE.length;
      // find the cue covering the START of the match, and the cue covering
      // its END (could be the same cue, or a later one if the quote spans
      // multiple cues) -- badge should stay lit for the full matched span.
      let startCue = offsetToCue[0].cue;
      let endCue = offsetToCue[0].cue;
      for (const entry of offsetToCue) {
        if (entry.offset <= idx) startCue = entry.cue;
        if (entry.offset <= endIdx) endCue = entry.cue;
        else break;
      }
      log('MATCH found, cue.startTime =', startCue.startTime, '-> endTime =', endCue.endTime, 'text:', startCue.text);
      window.__status.quoteMatch = { startTime: startCue.startTime, endTime: endCue.endTime, text: startCue.text };

      // seek to just before the matched span so playback naturally arrives
      // at the badge moment, instead of a stale/unrelated hardcoded offset
      video.currentTime = Math.max(0, startCue.startTime - 5);
      video.play().catch(e => log('play() rejected:', e.message));
    }
  }

  video.addEventListener('loadedmetadata', () => log('loadedmetadata, duration=', video.duration));
  video.addEventListener('playing', () => log('playing at currentTime=', video.currentTime));
  video.addEventListener('error', () => log('video element error:', video.error && video.error.message));

  const labelText = document.getElementById('labelText');
  const labelBg = document.getElementById('labelBg');
  const tagBadge = document.getElementById('tagBadge');

  setInterval(() => {
    const t = video.currentTime;
    labelText.textContent = `t=${t.toFixed(1)}s`;
    requestAnimationFrame(() => {
      const bbox = labelText.getBBox();
      labelBg.setAttribute('width', bbox.width + 16);
      labelBg.setAttribute('height', bbox.height + 10);
    });

    // #94 proof: icon only lights up while playback is inside the exact
    // quote-matched cue span, not just "somewhere in this speaker's turn".
    const match = window.__status.quoteMatch;
    const inTaggedSpan = match && t >= match.startTime && t <= match.endTime;
    tagBadge.setAttribute('opacity', inTaggedSpan ? '1' : '0');

    window.__status.currentTime = t;
    window.__status.paused = video.paused;
  }, 250);
</script>
</body>
</html>
