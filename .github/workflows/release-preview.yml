name: Preview-release

# Een git-tag publiceren als eigen subdomein. Zie docs/release.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag om te publiceren, bijv. v0.3.0"
        required: true

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installeer frontend-dependencies
        run: npm ci
        working-directory: frontend

      - name: Bepaal de tag
        id: tag
        run: echo "naam=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Bouw en publiceer
        id: publiceer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make release TAG="${{ steps.tag.outputs.naam }}"

      - name: Toon de URL in de samenvatting
        if: success()
        # De hostnaam komt uit het releasescript zelf (het schrijft hem naar
        # GITHUB_OUTPUT), zodat de tag hier niet nog eens omgezet hoeft te worden.
        env:
          host: ${{ steps.publiceer.outputs.hostnaam }}
        run: |
          {
            echo "## Preview-release gepubliceerd"
            echo ""
            echo "**<https://$host>**"
            echo ""
            echo "Het certificaat kan een paar minuten nodig hebben voordat het actief is."
          } >> "$GITHUB_STEP_SUMMARY"
