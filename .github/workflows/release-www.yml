name: Publiceer www

# Elke push naar main publiceert naar www.bipolariteit.org. Zie docs/release.md.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-www
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installeer frontend-dependencies
        run: npm ci
        working-directory: frontend

      - name: Bouw en publiceer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make release-www

      - name: Controleer op publiek gelekte bestanden
        # Draait ná de deploy: de live-probe heeft de gedeployde hostnaam nodig.
        # Faalt de run hierop, dan is de site al live -- zie docs/release.md
        # voor hoe je 'm dan meteen weer weghaalt.
        run: uv run python scripts/check_public_exposure.py www.bipolariteit.org

      - name: Toon de URL in de samenvatting
        if: success()
        run: |
          {
            echo "## www.bipolariteit.org gepubliceerd"
            echo ""
            echo "**<https://www.bipolariteit.org>**"
            echo ""
            echo "Het certificaat kan een paar minuten nodig hebben voordat het actief is."
          } >> "$GITHUB_STEP_SUMMARY"
